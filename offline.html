<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oflayn — IELTS Speaking Pro</title>
<link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
<style>
  :root { color-scheme: light dark; }
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
       background:#EFF6FF;color:#0F172A}
  @media (prefers-color-scheme: dark){ body{background:#060B14;color:#F1F5F9} }
  .card{max-width:420px;text-align:center;background:#fff;border-radius:24px;padding:36px 28px;
        box-shadow:0 10px 40px -10px rgba(15,23,42,.18)}
  @media (prefers-color-scheme: dark){ .card{background:#141029;box-shadow:none;border:1px solid rgba(255,255,255,.1)} }
  img{width:84px;height:84px;margin-bottom:18px}
  h1{font-size:20px;margin:0 0 10px}
  p{font-size:14px;line-height:1.6;opacity:.75;margin:0 0 22px}
  button{background:#0A4FA8;color:#fff;border:0;border-radius:999px;padding:13px 28px;
         font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  button:hover{opacity:.9}
</style>
</head>
<body>
  <div class="card">
    <img src="assets/icons/icon-192.png" alt="IELTS Speaking Pro">
    <h1>Internet aloqasi yo‘q</h1>
    <p>Ilova hali to‘liq yuklanmagan. Internetga ulanib, bir marta oching — shundan keyin
       Part 1, Part 2, Part 3 mavzulari va Best Answer’lar internetsiz ham ishlaydi.</p>
    <button type="button" onclick="location.reload()">Qayta urinish</button>
  </div>
</body>
</html>
