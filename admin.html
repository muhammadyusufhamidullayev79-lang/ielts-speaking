<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob: data: https:; connect-src 'self' https: data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'">
<title>Admin Panel — IELTS Speaking Pro</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== IELTS Speaking — Admin panel ===================== */
:root{
  --bg:#0A1020;
  --bg-glow:radial-gradient(1200px 600px at 85% -10%, rgba(99,102,241,.18), transparent 60%),
             radial-gradient(900px 500px at -10% 110%, rgba(139,92,246,.14), transparent 55%);
  --sidebar:#0C1526;
  --panel:#111B30;
  --panel-2:#16223A;
  --panel-3:#0F1830;
  --border:rgba(148,163,184,.14);
  --border-soft:rgba(148,163,184,.10);
  --text:#EAF0FA;
  --muted:#8FA0BC;
  --muted-2:#6B7A94;
  --accent:#6366F1;
  --accent-2:#8B5CF6;
  --accent-soft:rgba(99,102,241,.16);
  --danger:#F43F5E;
  --danger-soft:rgba(244,63,94,.14);
  --success:#10B981;
  --success-soft:rgba(16,185,129,.16);
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 18px 50px -22px rgba(2,6,23,.8);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  background-image:var(--bg-glow);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:var(--text)}
h1,h2,h3,p{margin:0}
.hidden{display:none !important}
.no-scroll{overflow:hidden}
.ic{width:16px;height:16px;flex:none;vertical-align:-2px}
.ic-lg{width:20px;height:20px}

/* ===== layout ===== */
.admin-shell{display:flex;min-height:100vh}

/* ===== sidebar ===== */
.sidebar{
  width:252px;flex:none;position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,var(--sidebar),#0A1122);
  border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:22px 14px;
  z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand img{width:38px;height:38px;border-radius:11px;object-fit:cover;box-shadow:0 6px 18px -6px rgba(99,102,241,.6)}
.brand-name{font-weight:800;font-size:14px;line-height:1.2;letter-spacing:-.01em}
.brand-sub{display:flex;align-items:center;gap:6px;margin-top:2px}
.brand-sub .admin-badge{font-size:10px;font-weight:800;letter-spacing:.08em;color:#C7D2FE;background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(139,92,246,.35));border:1px solid rgba(139,92,246,.35);padding:2px 7px;border-radius:999px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--muted-2);padding:14px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
  color:var(--muted);font-size:13.5px;font-weight:600;text-align:left;width:100%;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.nav-item:hover{background:rgba(148,163,184,.08);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(99,102,241,.28),rgba(139,92,246,.22));color:#fff;box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.nav-item .nav-badge{margin-left:auto;font-size:11px;font-weight:700;color:#C7D2FE;background:rgba(99,102,241,.22);border:1px solid rgba(139,92,246,.3);padding:1px 8px;border-radius:999px}
.nav-item.active .nav-badge{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.nav-divider{height:1px;background:var(--border-soft);margin:12px 8px}
.sidebar-foot{display:flex;flex-direction:column;gap:6px;padding-top:8px}

/* ===== main ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;height:60px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:0 28px;background:rgba(10,16,32,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.topbar-title{font-weight:800;font-size:15px;letter-spacing:-.01em}
.topbar-right{display:flex;align-items:center;gap:10px}
.menu-btn{display:none}
.content{padding:28px;max-width:1060px;width:100%;margin:0 auto}

/* ===== buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:10px;font-size:13px;font-weight:700;
  border:1px solid transparent;transition:transform .15s ease,background .18s ease,box-shadow .18s ease,border-color .18s ease;
  white-space:nowrap;line-height:1;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 24px -10px rgba(99,102,241,.75)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(99,102,241,.85);filter:brightness(1.06)}
.btn-ghost{background:rgba(148,163,184,.07);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:rgba(148,163,184,.14)}
.btn-danger{background:linear-gradient(135deg,#F43F5E,#E11D48);color:#fff;box-shadow:0 10px 24px -10px rgba(244,63,94,.7)}
.btn-danger:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn-danger-ghost{background:transparent;border-color:rgba(244,63,94,.35);color:#FDA4AF}
.btn-danger-ghost:hover{background:var(--danger-soft);border-color:rgba(244,63,94,.55)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn-lg{padding:12px 20px;font-size:14px;border-radius:12px}
.btn-back{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 13px}
.btn-back:hover{color:var(--text);border-color:var(--muted)}

/* ===== inputs ===== */
.field{display:block;margin-bottom:14px}
.field-label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:.01em}
.input,textarea.input{
  width:100%;background:var(--panel-3);border:1px solid var(--border);border-radius:11px;
  padding:11px 13px;font-size:14px;outline:none;color:var(--text);
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
}
.input::placeholder{color:var(--muted-2)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel)}
textarea.input{resize:vertical;min-height:88px;line-height:1.55}
.search-box{
  display:flex;align-items:center;gap:9px;flex:1;max-width:340px;
  background:var(--panel-3);border:1px solid var(--border);border-radius:11px;padding:9px 13px;
  transition:border-color .16s ease,box-shadow .16s ease;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-box .ic{color:var(--muted)}
.search-box input{background:none;border:none;outline:none;flex:1;font-size:14px;color:var(--text)}
.search-box input::placeholder{color:var(--muted-2)}

/* ===== cards ===== */
.card{background:linear-gradient(180deg,var(--panel),var(--panel-3));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.list-card{padding:14px}
.view-head{margin-bottom:20px}
.view-head h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.view-head .sub{color:var(--muted);font-size:13.5px;margin-top:5px}
.view-head p.sub-line{color:var(--muted);font-size:13.5px;margin-top:5px}
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.crumb{cursor:pointer;font-weight:600;color:var(--muted);transition:color .15s ease}
.crumb:hover{color:var(--text)}
.crumb-sep{color:var(--muted-2);user-select:none}
.crumb-current{color:var(--text);cursor:default;font-weight:700}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .note{flex:1;min-width:200px;color:var(--muted);font-size:12.5px}
.toolbar .grow{flex:1}

/* ===== dashboard stat cards ===== */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat-card{
  display:flex;align-items:center;gap:15px;text-align:left;width:100%;
  background:linear-gradient(180deg,var(--panel),var(--panel-3));
  border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.stat-card:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.5);box-shadow:0 22px 50px -20px rgba(99,102,241,.55)}
.stat-icon{width:48px;height:48px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:20px}
.stat-icon .ic{width:22px;height:22px}
.icon-part1{background:rgba(56,189,248,.14);color:#7DD3FC;border:1px solid rgba(56,189,248,.3)}
.icon-part2{background:rgba(251,191,36,.14);color:#FCD34D;border:1px solid rgba(251,191,36,.3)}
.icon-part3{background:rgba(52,211,153,.14);color:#6EE7B7;border:1px solid rgba(52,211,153,.3)}
.stat-body{flex:1;min-width:0}
.stat-name{font-weight:800;font-size:15px}
.stat-nums{margin-top:4px;font-size:13px;color:var(--muted)}
.stat-nums b{color:var(--text);font-size:15px;font-weight:800}
.stat-arrow{color:var(--muted-2);transition:transform .18s ease,color .18s ease}
.stat-card:hover .stat-arrow{transform:translateX(4px);color:var(--accent-2)}
.hint-card{display:flex;gap:13px;align-items:flex-start;margin-top:18px;padding:16px 18px;background:linear-gradient(180deg,rgba(99,102,241,.08),rgba(99,102,241,.02));border:1px solid rgba(99,102,241,.22);border-radius:var(--radius);color:var(--muted);font-size:13px;line-height:1.6}
.hint-icon{color:var(--accent-2);margin-top:1px}

/* ===== lists ===== */
.list{display:flex;flex-direction:column;gap:10px}
.topic-row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--border-soft);border-radius:14px;
  transition:transform .16s ease,border-color .16s ease,background .16s ease;
}
.topic-row:hover{transform:translateY(-1px);border-color:rgba(139,92,246,.45);background:var(--panel)}
.topic-icon{width:42px;height:42px;flex:none;border-radius:11px;background:var(--panel-3);border:1px solid var(--border-soft);display:grid;place-items:center;font-size:19px}
.topic-body{flex:1;min-width:0}
.topic-title{font-weight:700;font-size:14.5px;letter-spacing:-.01em;line-height:1.35}
.topic-sub{margin-top:3px;font-size:12.5px;color:var(--muted)}
.topic-sub .dot{margin:0 6px;color:var(--muted-2)}
.topic-actions{display:flex;gap:8px;flex:none}
.q-row{
  display:flex;align-items:center;gap:14px;padding:13px 15px;
  background:var(--panel-2);border:1px solid var(--border-soft);border-radius:13px;
  transition:border-color .15s ease,background .15s ease;
}
.q-row:hover{border-color:rgba(139,92,246,.4);background:var(--panel)}
.q-num{
  width:28px;height:28px;flex:none;border-radius:9px;font-size:12px;font-weight:800;
  display:grid;place-items:center;color:#C7D2FE;background:var(--accent-soft);border:1px solid rgba(99,102,241,.3);
}
.q-text{flex:1;min-width:0}
.q-title{font-weight:600;font-size:14px;line-height:1.5}
.q-answer{margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-actions{display:flex;gap:8px;flex:none}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .empty-icon{font-size:30px;margin-bottom:10px;color:var(--muted-2)}
.empty .empty-title{font-weight:700;font-size:14.5px;color:var(--text);margin-bottom:4px}
.empty .empty-sub{font-size:12.5px}

/* ===== title row (questions view) ===== */
.title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.title-row .grow{flex:1;min-width:200px}
.title-row h1{font-size:21px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== login ===== */
.login-wrap{flex:1;display:grid;place-items:center;padding:32px 18px;min-height:100vh}
.login-card{
  width:100%;max-width:380px;background:linear-gradient(180deg,var(--panel),var(--panel-3));
  border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);
  padding:38px 32px;text-align:center;animation:pop .35s cubic-bezier(.2,.8,.3,1) both;
}
.login-logo{width:58px;height:58px;margin:0 auto 18px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;box-shadow:0 16px 34px -12px rgba(99,102,241,.8)}
.login-logo .ic{width:26px;height:26px;color:#fff}
.login-card h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.login-card .login-sub{color:var(--muted);font-size:13px;margin-top:7px;line-height:1.55}
.login-card form{margin-top:26px;text-align:left}
.login-error{
  display:flex;align-items:center;gap:8px;margin-top:14px;padding:11px 13px;border-radius:11px;
  background:var(--danger-soft);border:1px solid rgba(244,63,94,.3);color:#FDA4AF;font-size:12.5px;font-weight:600;line-height:1.45;
}
.login-card .btn{width:100%;margin-top:18px}
.login-foot{text-align:center;color:var(--muted-2);font-size:11.5px;margin-top:18px}

/* ===== modals ===== */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(3,7,18,.7);backdrop-filter:blur(5px);animation:fade .2s ease both}
.modal-dialog{
  position:relative;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto;
  background:linear-gradient(180deg,var(--panel),var(--panel-3));border:1px solid var(--border);
  border-radius:20px;box-shadow:var(--shadow);animation:pop .28s cubic-bezier(.2,.8,.3,1) both;
}
.modal-sm{max-width:420px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border-soft)}
.modal-head h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.modal-x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);background:rgba(148,163,184,.08);transition:background .15s ease,color .15s ease}
.modal-x:hover{background:rgba(148,163,184,.18);color:var(--text)}
.modal-body{padding:20px 22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border-soft)}
.modal-foot.center{justify-content:center}
.part-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.06em;color:#C7D2FE;background:var(--accent-soft);border:1px solid rgba(99,102,241,.3);padding:3px 10px;border-radius:999px;margin-bottom:14px}
.confirm-icon{width:52px;height:52px;margin:0 auto 16px;border-radius:15px;background:var(--danger-soft);border:1px solid rgba(244,63,94,.3);color:#FDA4AF;display:grid;place-items:center}
.confirm-icon .ic{width:24px;height:24px}
.confirm-title{font-size:17px;font-weight:800;text-align:center}
.confirm-message{margin-top:9px;font-size:13.5px;color:var(--muted);text-align:center;line-height:1.6;white-space:pre-line}
.confirm-body{padding:26px 26px 6px}

/* ===== toast ===== */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px 18px;font-size:13.5px;font-weight:700;color:var(--text);
  box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(16,185,129,.5)}
.toast.success::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:9px;vertical-align:1px}
.toast.error{border-color:rgba(244,63,94,.5)}
.toast.error::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:9px;vertical-align:1px}

/* ===== animations ===== */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.view-anim{animation:fadeUp .3s ease both}

/* ===== import / mocks ===== */
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.meta-line{font-size:13px;color:var(--muted);line-height:1.6}
.mock-row{display:flex;align-items:center;gap:13px;padding:12px 14px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:12px;margin-bottom:8px}
.mock-badge{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.mock-badge.done{background:var(--success)}
.mock-badge.warn{background:#F59E0B}
.mock-info{flex:1;min-width:0}
.mock-info .t{font-size:13px;font-weight:700}
.mock-info .s{font-size:12px;color:var(--muted);margin-top:2px}

/* ===== responsive ===== */
@media (max-width:900px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s ease;
    box-shadow:20px 0 60px rgba(2,6,23,.6);
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(3,7,18,.6);backdrop-filter:blur(2px);z-index:35}
  .menu-btn{display:inline-flex}
  .content{padding:20px 16px}
  .topbar{padding:0 16px}
  .stat-grid{grid-template-columns:1fr}
  .topic-actions{flex-direction:column}
  .q-row{flex-wrap:wrap}
  .q-actions{margin-left:42px}
}
</style>
</head>
<body>
<div class="admin-shell">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/logo.png" alt="IELTS Speaking Pro">
      <div>
        <div class="brand-name">IELTS Speaking</div>
        <div class="brand-sub"><span class="admin-badge">ADMIN</span></div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-label">BOSHQARUV</div>
      <button class="nav-item" data-view="overview" onclick="navigate('overview')">
        <span class="ic" data-ic="dashboard"></span> Dashboard
      </button>
      <button class="nav-item" data-view="part1" onclick="navigate('part','part1')">
        <span class="ic" data-ic="messages"></span> Part 1
        <span class="nav-badge" id="navCount-p1">0</span>
      </button>
      <button class="nav-item" data-view="part2" onclick="navigate('part','part2')">
        <span class="ic" data-ic="file"></span> Part 2
        <span class="nav-badge" id="navCount-p2">0</span>
      </button>
      <button class="nav-item" data-view="part3" onclick="navigate('part','part3')">
        <span class="ic" data-ic="chart"></span> Part 3
        <span class="nav-badge" id="navCount-p3">0</span>
      </button>
      <div class="nav-divider"></div>
      <div class="nav-label">VOSITALAR</div>
      <button class="nav-item" data-view="import" onclick="navigate('import')">
        <span class="ic" data-ic="upload"></span> Import / Export
      </button>
      <button class="nav-item" data-view="mocks" onclick="navigate('mocks')">
        <span class="ic" data-ic="clock"></span> Mock tarixi
      </button>
    </nav>
    <div class="sidebar-foot">
      <a class="btn btn-ghost" href="index.html" style="text-decoration:none;width:100%"><span class="ic" data-ic="home"></span> Saytga qaytish</a>
      <button class="btn btn-danger-ghost" id="logoutBtn" onclick="adminLogout()" style="width:100%"><span class="ic" data-ic="logout"></span> Chiqish</button>
    </div>
  </aside>
  <div class="sidebar-backdrop hidden" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>

  <!-- ===== MAIN ===== -->
  <div class="main">
    <header class="topbar" id="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-ghost menu-btn" onclick="toggleSidebar(true)" aria-label="Menyu"><span class="ic" data-ic="menu"></span></button>
        <span class="topbar-title" id="topbarTitle">Dashboard</span>
      </div>
      <div class="topbar-right">
        <a class="btn btn-ghost" href="index.html"><span class="ic" data-ic="home"></span> Saytga qaytish</a>
        <button class="btn btn-danger" id="logoutBtnTop" onclick="adminLogout()"><span class="ic" data-ic="logout"></span> Chiqish</button>
      </div>
    </header>

    <main class="content">

      <!-- LOGIN -->
      <div class="login-wrap" id="loginView">
        <div class="login-card">
          <div class="login-logo"><span class="ic" data-ic="shield"></span></div>
          <h1>Admin Panel</h1>
          <p class="login-sub">Faqat administratorlar uchun.<br>Davom etish uchun parolni kiriting.</p>
          <form onsubmit="handleLogin(event)" autocomplete="off">
            <label class="field-label" for="adminPass">Parol</label>
            <input class="input" id="adminPass" type="password" placeholder="Parolni kiriting" maxlength="64" autocomplete="current-password" autofocus>
            <div class="login-error hidden" id="loginError"></div>
            <button type="submit" class="btn btn-primary btn-lg"><span class="ic" data-ic="login"></span> Kirish</button>
          </form>
        </div>
      </div>

      <!-- APP -->
      <div id="appView" class="hidden view-anim"></div>

    </main>
  </div>
</div>

<!-- ===== TOPIC MODAL ===== -->
<div class="modal" id="topicModal" role="dialog" aria-modal="true">
  <div class="modal-backdrop" onclick="closeTopicModal()"></div>
  <div class="modal-dialog">
    <div class="modal-head">
      <h3 id="topicModalTitle">Yangi mavzu qo'shish</h3>
      <button class="modal-x" onclick="closeTopicModal()" aria-label="Yopish"><span class="ic" data-ic="x"></span></button>
    </div>
    <div class="modal-body">
      <span class="part-chip" id="topicModalPart">Part 1</span>
      <label class="field">
        <span class="field-label">Mavzu nomi *</span>
        <input class="input" id="topicTitle" maxlength="120" placeholder="Masalan: Education">
      </label>
      <label class="field">
        <span class="field-label">Tarjima (ixtiyoriy)</span>
        <input class="input" id="topicUz" maxlength="80" placeholder="Masalan: Ta'lim">
      </label>
      <label class="field">
        <span class="field-label">Icon (emoji, ixtiyoriy)</span>
        <input class="input" id="topicIcon" maxlength="4" placeholder="🎓">
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeTopicModal()">Bekor qilish</button>
      <button class="btn btn-primary" onclick="saveTopic()">Saqlash</button>
    </div>
  </div>
</div>

<!-- ===== QUESTION MODAL ===== -->
<div class="modal" id="questionModal" role="dialog" aria-modal="true">
  <div class="modal-backdrop" onclick="closeQuestionModal()"></div>
  <div class="modal-dialog">
    <div class="modal-head">
      <h3 id="questionModalTitle">Yangi savol qo'shish</h3>
      <button class="modal-x" onclick="closeQuestionModal()" aria-label="Yopish"><span class="ic" data-ic="x"></span></button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span class="field-label" id="questionTextLabel">Savol matni *</span>
        <input class="input" id="qText" maxlength="200" placeholder="Savolni kiriting...">
      </label>
      <div id="qAnswerFields">
        <label class="field">
          <span class="field-label">Best Answer (ixtiyoriy)</span>
          <textarea class="input" id="qAnswer" maxlength="3000" rows="4" placeholder="Band 8-9 namuna javob..."></textarea>
        </label>
        <label class="field">
          <span class="field-label">Vocab (vergul bilan, ixtiyoriy)</span>
          <input class="input" id="qVocab" maxlength="200" placeholder="vibrant, cherish, to be honest">
        </label>
        <label class="field">
          <span class="field-label">Tip (ixtiyoriy)</span>
          <input class="input" id="qTip" maxlength="200" placeholder="Use one complex sentence + idiom.">
        </label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeQuestionModal()">Bekor qilish</button>
      <button class="btn btn-primary" onclick="saveQuestion()">Saqlash</button>
    </div>
  </div>
</div>

<!-- ===== ANSWER MODAL (Part 2) ===== -->
<div class="modal" id="answerModal" role="dialog" aria-modal="true">
  <div class="modal-backdrop" onclick="closeAnswerModal()"></div>
  <div class="modal-dialog">
    <div class="modal-head">
      <h3>Best Answer — Cue Card</h3>
      <button class="modal-x" onclick="closeAnswerModal()" aria-label="Yopish"><span class="ic" data-ic="x"></span></button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span class="field-label">Best Answer (~2 daqiqalik namuna)</span>
        <textarea class="input" id="ansText" maxlength="4000" rows="8" placeholder="Band 9 namuna javob..."></textarea>
      </label>
      <label class="field">
        <span class="field-label">Vocab (vergul bilan)</span>
        <input class="input" id="ansVocab" maxlength="200">
      </label>
      <label class="field">
        <span class="field-label">Tip</span>
        <input class="input" id="ansTip" maxlength="200">
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeAnswerModal()">Bekor qilish</button>
      <button class="btn btn-primary" onclick="saveAnswerModal()">Saqlash</button>
    </div>
  </div>
</div>

<!-- ===== CONFIRM MODAL ===== -->
<div class="modal" id="confirmModal" role="dialog" aria-modal="true">
  <div class="modal-backdrop" onclick="confirmNo()"></div>
  <div class="modal-dialog modal-sm">
    <div class="confirm-body">
      <div class="confirm-icon"><span class="ic" data-ic="alert"></span></div>
      <h3 class="confirm-title" id="confirmTitle">O'chirish</h3>
      <p class="confirm-message" id="confirmMessage"></p>
    </div>
    <div class="modal-foot center">
      <button class="btn btn-ghost" onclick="confirmNo()">Bekor qilish</button>
      <button class="btn btn-danger" id="confirmYesBtn" onclick="confirmYes()">O'chirish</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
